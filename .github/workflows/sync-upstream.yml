name: Sync Upstream WordPress/sqlite‑database‑integration
on:
  schedule:
    - cron: '0 2 * * *' # UTC时间每日凌晨2点执行，相当于北京时间上午10点
  workflow_dispatch: # 支持网页手动点按钮立即触发

jobs:
  sync:
    runs-on: ubuntu‑latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch‑depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync upstream trunk
        uses: aormsby/Fork‑Sync‑Action@master
        with:
          upstream‑repository: WordPress/sqlite‑database‑integration
          target‑branch: trunk
          upstream‑branch: trunk
          git‑push‑options: "--force‑with‑lease"
